<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EML Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ── Base variables ─────────────────────────────────────────────────────── */
  :root {
    --bg:         #0a0c0f;
    --surface:    #13161e;
    --border:     #222630;
    --border2:    #2e3442;
    --accent:     #00d4aa;
    --accent2:    #0099ff;
    --warn:       #ffaa00;
    --danger:     #ff4455;
    --text:       #d4dce8;
    --text-dim:   #6e7a8a;
    --text-bright:#f0f4fa;
    --mono:       'IBM Plex Mono', monospace;
    --sans:       'IBM Plex Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px,
      rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* ── Layout ─────────────────────────────────────────────────────────────── */
  .app {
    max-width: 100%;
    margin: 0 auto;
    padding: 28px 40px 60px;
  }

  /* ── Header ─────────────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px;
    border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 16px; position: relative;
  }
  .logo-icon::after {
    content: ''; position: absolute; inset: 2px;
    border: 1px solid var(--accent); opacity: 0.3;
  }
  h1 {
    font-family: var(--mono); font-size: 18px; font-weight: 600;
    color: var(--text-bright); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .tagline {
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em;
    margin-left: auto; text-transform: uppercase;
  }

  /* ── Tabs ───────────────────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 2px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 20px; font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim);
    cursor: pointer; border: none; background: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Input zones ────────────────────────────────────────────────────────── */
  .input-zone {
    border: 1px solid var(--border); background: var(--surface);
    padding: 24px; margin-bottom: 20px;
  }
  .zone-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .zone-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .dropzone {
    border: 1px dashed var(--border2); padding: 40px; text-align: center;
    cursor: pointer; transition: border-color 0.2s, background 0.2s; position: relative;
  }
  .dropzone:hover, .dropzone.dragover { border-color: var(--accent); background: rgba(0,212,170,.03); }
  .dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-icon { font-size: 28px; margin-bottom: 12px; color: var(--text-dim); }
  .drop-title { font-size: 13px; color: var(--text); margin-bottom: 6px; }
  .drop-sub { font-size: 11px; color: var(--text-dim); }
  .file-loaded {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: rgba(0,212,170,.06); border: 1px solid rgba(0,212,170,.2);
    color: var(--accent); font-size: 12px;
  }

  textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 14px; resize: vertical; min-height: 200px; line-height: 1.7;
    outline: none; transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--border2); }
  textarea::placeholder { color: var(--text-dim); }

  /* ── Buttons ────────────────────────────────────────────────────────────── */
  .btn-row { display: flex; gap: 10px; align-items: center; }
  .btn {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 10px 22px; border: none; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #00bfa0; }
  .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text-dim); }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

  /* ── Results container ──────────────────────────────────────────────────── */
  #results { display: none; animation: fadeIn 0.3s ease; }
  #results.visible { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .results-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .results-title { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .badge-ok   { background: rgba(0,212,170,.1);  color: var(--accent); }
  .badge-warn { background: rgba(255,170,0,.1);  color: var(--warn); }

  /* ── Summary strip ──────────────────────────────────────────────────────── */
  .summary-strip { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 1px; background: var(--border); margin-bottom: 24px; }
  .summary-card { background: var(--surface); padding: 16px 18px; }
  .summary-card .label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .summary-card .value { font-size: 12px; color: #e0e8f5; word-break: break-all; }
  .summary-card .value.accent { color: var(--accent); }
  .summary-card .value.warn   { color: var(--warn); }

  /* ── Sections ───────────────────────────────────────────────────────────── */
  .section { margin-bottom: 16px; border: 1px solid var(--border); }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px; background: #0e1016; border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .section-head:hover { background: #13161e; }
  .section-name { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  .section-count { font-size: 10px; color: var(--text-dim); background: var(--border); padding: 1px 7px; }
  .chevron { color: var(--text-dim); font-size: 10px; transition: transform 0.2s; }
  .section.collapsed .chevron { transform: rotate(-90deg); }
  .section.collapsed .section-body { display: none; }
  .section-body { padding: 0; }

  /* ── KV table ───────────────────────────────────────────────────────────── */
  .kv-table { width: 100%; border-collapse: collapse; }
  .kv-table tr { border-bottom: 1px solid var(--border); }
  .kv-table tr:last-child { border-bottom: none; }
  .kv-table tr:hover td { background: rgba(255,255,255,.015); }
  .kv-table td { padding: 9px 16px; vertical-align: top; font-size: 12px; line-height: 1.6; }
  .kv-table td:first-child { width: 200px; color: #8a96a8; white-space: nowrap; font-size: 11px; letter-spacing: .03em; }
  .kv-table td:last-child  { color: #e8edf8; word-break: break-word; }

  /* ── Auth ───────────────────────────────────────────────────────────────── */
  .auth-block            { border-bottom: 1px solid var(--border); }
  .auth-block:last-child { border-bottom: none; }
  .auth-proto-row        { display:flex; align-items:flex-start; gap:10px; padding:12px 16px 4px; }
  .auth-proto-name       { width:52px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#8a96a8; padding-top:2px; flex-shrink:0; }
  .auth-clause           { font-size:11px; color:#c8d6e8; line-height:1.7; flex:1; word-break:break-all; }
  .auth-raw-block        { margin:0 16px 12px; padding:10px 14px; background:#0a0c10; font-size:11px; color:#6e7a8a; white-space:pre-wrap; word-break:break-all; line-height:1.7; border-left:2px solid #222630; }
  .pill { padding: 2px 9px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .pill-pass { background: rgba(0,212,170,.12); color: var(--accent); }
  .pill-fail { background: rgba(255,68,85,.12);  color: var(--danger); }
  .pill-none { background: rgba(90,99,112,.2);   color: var(--text-dim); }

  /* ── Hop table ──────────────────────────────────────────────────────────── */
  .hop-table { width:100%; border-collapse:collapse; font-size:12px; }
  .hop-table th { padding:8px 12px; background:#0a0c10; color:#6e7a8a; font-size:10px; letter-spacing:.08em; text-transform:uppercase; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  .hop-table td { padding:10px 12px; vertical-align:top; border-bottom:1px solid var(--border); color:#d4dce8; word-break:break-word; }
  .hop-table tr:last-child td { border-bottom:none; }
  .hop-table tr.hop-raw-row td { padding:2px 12px 10px; color:#6e7a8a; font-size:10px; word-break:break-all; background:#0a0c10; }
  .hop-table tr:hover:not(.hop-raw-row) td { background:rgba(255,255,255,.02); }
  .hop-idx { color:var(--accent)!important; font-weight:600; width:32px; text-align:center; }
  .hop-delay-badge { display:inline-block; padding:2px 8px; font-size:10px; font-weight:600; background:rgba(255,170,0,.12); color:#ffaa00; letter-spacing:.04em; }
  .hop-delay-fast  { background:rgba(0,212,170,.1)!important; color:var(--accent)!important; }
  .hop-delay-neg   { background:rgba(255,68,85,.1)!important;  color:#ff4455!important; }

  /* ── IOC ────────────────────────────────────────────────────────────────── */
  .ioc-tabs  { display:flex; gap:2px; padding:12px 16px 0; border-bottom:1px solid var(--border); }
  .ioc-tab   { font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:7px 16px; border:none; background:transparent; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s,border-color .15s; }
  .ioc-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .ioc-tab:hover  { color:var(--text); }
  .ioc-panel      { display:none; }
  .ioc-panel.active { display:block; }
  .ioc-list  { padding:0; }
  .ioc-item  { display:flex; align-items:center; padding:8px 16px; border-bottom:1px solid var(--border); gap:10px; }
  .ioc-item:last-child { border-bottom:none; }
  .ioc-item:hover { background:rgba(255,255,255,.02); }
  .ioc-val   { font-size:12px; color:#5bc8ff; flex:1; word-break:break-all; font-family:var(--mono); }
  .ioc-val.url  { color:#a78bfa; }
  .ioc-val.hash { font-size:11px; color:var(--accent); }
  .ioc-fname { font-size:11px; color:var(--text-dim); }
  .ioc-empty { padding:16px; color:var(--text-dim); font-size:12px; }
  .copy-btn  { flex-shrink:0; background:transparent; border:1px solid var(--border2); color:var(--text-dim); font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; cursor:pointer; transition:all .15s; }
  .copy-btn:hover  { border-color:var(--accent); color:var(--accent); }
  .copy-btn.copied { border-color:var(--accent); color:var(--accent); }
  .copy-all-btn    { font-size:10px; padding:4px 14px; }

  /* ── Attachments ────────────────────────────────────────────────────────── */
  .attach-row { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); font-size:12px; }
  .attach-row:last-child { border-bottom:none; }
  .attach-icon { color:var(--accent2); font-size:16px; }
  .attach-name { color:var(--text-bright); flex:1; }
  .attach-size { color:var(--text-dim); font-size:11px; }
  .attach-type { color:var(--text-dim); font-size:10px; letter-spacing:.05em; }
  .dl-btn { flex-shrink:0; background:transparent; border:1px solid var(--border2); color:var(--text-dim); font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; cursor:pointer; text-decoration:none; transition:all .15s; display:inline-block; }
  .dl-btn:hover { border-color:#ffaa00; color:#ffaa00; }

  /* ── HTML viewer ────────────────────────────────────────────────────────── */
  .html-toolbar { display:flex; gap:6px; padding:10px 14px; border-bottom:1px solid var(--border); background:#0a0c10; align-items:center; flex-wrap:wrap; }
  .html-toolbar button { font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:5px 14px; border:1px solid var(--border2); background:transparent; color:var(--text-dim); cursor:pointer; transition:all .15s; }
  .html-toolbar button.active { border-color:var(--accent); color:var(--accent); background:rgba(0,212,170,.06); }
  .html-toolbar button:hover  { border-color:var(--text); color:var(--text); }
  .html-frame  { width:100%; height:520px; border:none; background:#fff; display:block; }
  .html-source { background:#080a0d; padding:14px; font-size:11px; line-height:1.8; white-space:pre; overflow:auto; max-height:520px; color:#abb2bf; }
  .hl-tag     { color:#e06c75; }
  .hl-attr    { color:#d19a66; }
  .hl-val     { color:#98c379; }
  .hl-cmt     { color:#5c6370; font-style:italic; }
  .hl-doctype { color:#5c6370; }

  /* ── MIME tree ──────────────────────────────────────────────────────────── */
  .mime-node { border-left:2px solid var(--border2); margin-left:16px; padding:5px 10px; font-size:11px; }
  .mime-node:first-child { margin-left:0; border-left:none; padding-left:0; }
  .mime-type { color:#5bc8ff; }
  .mime-dis  { color:var(--text-dim); font-size:10px; margin-left:8px; }
  .mime-fn   { color:#ffaa00; font-size:10px; margin-left:8px; }
  .mime-enc  { color:var(--text-dim); font-size:10px; margin-left:8px; }

  /* ── Raw block ──────────────────────────────────────────────────────────── */
  .raw-block { background:var(--bg); padding:16px; font-size:11px; color:var(--text-dim); white-space:pre-wrap; word-break:break-all; max-height:300px; overflow-y:auto; line-height:1.8; }
  .raw-block .h-name { color:var(--accent2); }
  .raw-block .h-val  { color:var(--text); }

  /* ── Error box ──────────────────────────────────────────────────────────── */
  .error-box { border:1px solid rgba(255,68,85,.3); background:rgba(255,68,85,.05); padding:16px 20px; color:var(--danger); font-size:12px; margin-bottom:20px; }

  /* ── Scrollbar ──────────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--border2); }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">
      <div class="logo-icon">✉</div>
      <h1>EML Analyzer</h1>
    </div>
    <span class="tagline">Email Forensics Tool</span>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('file',this)">Upload .eml File</button>
    <button class="tab" onclick="switchTab('text',this)">Paste Headers / Raw</button>
  </div>

  <div id="tab-file" class="tab-panel active">
    <div class="input-zone">
      <div class="zone-label">EML File</div>
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".eml,.msg,message/rfc822,text/plain">
        <div class="drop-icon">📂</div>
        <div class="drop-title">Drop your .eml file here</div>
        <div class="drop-sub">or click to browse</div>
      </div>
      <div id="file-loaded" style="display:none" class="file-loaded">
        <span>📄</span>
        <span id="file-name"></span>
        <span id="file-size" style="margin-left:auto;color:var(--text-dim);font-size:11px;"></span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="analyzeFile()">Analyze</button>
      <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <div id="tab-text" class="tab-panel">
    <div class="input-zone">
      <div class="zone-label">Raw Headers or Full EML</div>
      <textarea id="rawInput" placeholder="Paste raw email headers or full EML content here...

From: sender@example.com
To: recipient@example.com
Subject: Test Email
Date: Mon, 1 Jan 2025 12:00:00 +0000
Received: from mail.example.com ...
Authentication-Results: spf=pass dkim=pass dmarc=pass
..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="analyzeText()">Analyze</button>
      <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <div id="results">
    <div style="height:32px"></div>
    <div class="results-header">
      <span class="results-title">Analysis Results</span>
      <span id="parse-status" class="badge badge-ok">● Parsed OK</span>
    </div>
    <div id="error-box" class="error-box" style="display:none"></div>
    <div class="summary-strip" id="summary-strip"></div>
    <div id="sections-container"></div>
  </div>

</div><!-- /.app -->

<script>
// ═══════════════════════════════════════════════════════════════════════════
// UI helpers
// ═══════════════════════════════════════════════════════════════════════════
function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
}

function toggleSection(i) {
  document.getElementById('sec-' + i).classList.toggle('collapsed');
}

// ── File handling ──────────────────────────────────────────────────────────
let loadedFileContent = null;
const dropzone  = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(f) {
  const reader = new FileReader();
  reader.onload = e => {
    loadedFileContent = e.target.result;
    dropzone.style.display = 'none';
    document.getElementById('file-loaded').style.display = 'flex';
    document.getElementById('file-name').textContent = f.name;
    document.getElementById('file-size').textContent = formatBytes(f.size);
  };
  reader.readAsText(f);
}

function clearAll() {
  loadedFileContent = null; fileInput.value = '';
  dropzone.style.display = 'block';
  document.getElementById('file-loaded').style.display = 'none';
  document.getElementById('rawInput').value = '';
  document.getElementById('results').classList.remove('visible');
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

// ═══════════════════════════════════════════════════════════════════════════
// Backend API
// ═══════════════════════════════════════════════════════════════════════════
async function callBackend(endpoint, payload) {
  let resp;
  if (endpoint === 'file') {
    const fd = new FormData(); fd.append('file', payload);
    resp = await fetch('/analyze/file', { method:'POST', body:fd });
  } else {
    resp = await fetch('/analyze/text', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ raw: payload }),
    });
  }
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: resp.statusText }));
    throw new Error(err.error || 'Server error');
  }
  return resp.json();
}

function analyzeFile() {
  const file = fileInput.files[0];
  if (!file && !loadedFileContent) { alert('Please select an .eml file first.'); return; }
  if (!file) {
    callBackend('text', loadedFileContent).then(renderFromBackend).catch(e => showError(e.message));
    return;
  }
  callBackend('file', file).then(renderFromBackend).catch(e => showError(e.message));
}

function analyzeText() {
  const raw = document.getElementById('rawInput').value.trim();
  if (!raw) { alert('Please paste some content first.'); return; }
  callBackend('text', raw).then(renderFromBackend).catch(e => showError(e.message));
}

function showError(msg) {
  const eb = document.getElementById('error-box');
  eb.textContent = '❌ ' + msg; eb.style.display = 'block';
  document.getElementById('results').classList.add('visible');
}

// ═══════════════════════════════════════════════════════════════════════════
// Main renderer
// ═══════════════════════════════════════════════════════════════════════════
function renderFromBackend(d) {
  document.getElementById('error-box').style.display = 'none';
  const core     = d.core            || {};
  const auth     = d.authentication  || {};
  const hops     = d.received_chain  || [];
  const attaches = d.attachments     || [];
  const summary  = d.summary         || {};
  const allHdrs  = d.all_headers     || [];
  const xHdrs    = d.x_headers       || [];
  const iocs     = d.iocs            || {};
  const mime     = d.mime_structure  || null;
  const bodies   = d.bodies          || {};

  document.getElementById('parse-status').className   = 'badge badge-ok';
  document.getElementById('parse-status').textContent = '● Parsed OK';

  // Summary strip
  const fromAddr = core.from ? core.from.address : '—';
  document.getElementById('summary-strip').innerHTML = [
    { label:'From',          value: fromAddr || '—', cls:'' },
    { label:'Subject',       value: core.subject || '—', cls:'' },
    { label:'Date',          value: core.date ? (core.date.raw || '—') : '—', cls:'' },
    { label:'Hops',          value: summary.hop_count ?? '—', cls: summary.hop_count > 5 ? 'warn':'accent' },
    { label:'IPs / Domains', value: `${(iocs.ips||[]).length} / ${(iocs.domains||[]).length}`, cls:'' },
    { label:'Attachments',   value: summary.attachment_count ?? 0, cls: summary.attachment_count ? 'warn':'' },
  ].map(c => `<div class="summary-card"><div class="label">${c.label}</div><div class="value ${c.cls}">${escHtml(String(c.value))}</div></div>`).join('');

  const sections = [];

  // MIME Structure
  if (mime) {
    sections.push({ title:'MIME Structure', count:'',
      html:`<div style="padding:14px 18px">${renderMimeNode(mime)}</div>` });
  }

  // Core Headers
  const mismatch = core.reply_to && core.reply_to.mismatch;
  const toStr  = (core.to  ||[]).map(t => t.name ? `${t.name} <${t.address}>` : t.address).join(', ');
  const ccStr  = (core.cc  ||[]).map(t => t.name ? `${t.name} <${t.address}>` : t.address).join(', ');
  const bccStr = (core.bcc ||[]).map(t => t.name ? `${t.name} <${t.address}>` : t.address).join(', ');
  const coreRows = [
    ['From',             core.from ? core.from.raw : ''],
    ['To', toStr], ['CC', ccStr], ['BCC', bccStr],
    ['Reply-To', (core.reply_to?.raw || '') + (mismatch ? ' ⚠ domain mismatch' : '')],
    ['Subject',          core.subject],
    ['Date',             core.date ? core.date.raw : ''],
    ['Message-ID',       core.message_id],
    ['MIME-Version',     core.mime_version],
    ['Content-Type',     core.content_type],
    ['X-Mailer',         core.x_mailer],
    ['X-Originating-IP', core.x_originating_ip],
  ].filter(([,v]) => v);
  sections.push({ title:'Core Headers', count: coreRows.length,
    html:`<table class="kv-table">${coreRows.map(([k,v]) => `<tr>
      <td>${escHtml(k)}</td>
      <td style="${k==='Reply-To'&&mismatch?'color:#ffaa00':''}">${escHtml(v)}</td>
    </tr>`).join('')}</table>`
  });

  // Authentication
  if (auth.raw) {
    const checks = auth.checks || [];
    let authHtml = '';
    if (checks.length) {
      authHtml += checks.map(c => {
        const pass = ['pass','bestguesspass'].includes(c.result);
        const fail = ['fail','hardfail','softfail','none','permerror','temperror'].includes(c.result);
        const pillCls = pass ? 'pill-pass' : fail ? 'pill-fail' : 'pill-none';
        return `<div class="auth-block">
          <div class="auth-proto-row">
            <span class="auth-proto-name">${c.name}</span>
            <span class="pill ${pillCls}" style="flex-shrink:0;margin-top:1px">${escHtml(c.result)}</span>
            <span class="auth-clause">${escHtml(c.clause||'')}</span>
          </div>
        </div>`;
      }).join('');
    }
    authHtml += `<div style="padding:4px 16px 12px">
      <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;margin-top:8px;">Full Authentication-Results</div>
      <div class="auth-raw-block">${escHtml(auth.raw)}</div>
    </div>`;
    if (auth.received_spf) authHtml += `<div class="auth-block"><div class="auth-proto-row">
      <span class="auth-proto-name">SPF HDR</span>
      <span class="auth-clause">${escHtml(auth.received_spf)}</span>
    </div></div>`;
    if (auth.dkim_header) authHtml += `<div class="auth-block"><div class="auth-proto-row">
      <span class="auth-proto-name">DKIM SIG</span>
      <span class="auth-clause" style="word-break:break-all">${escHtml(auth.dkim_header)}</span>
    </div></div>`;
    sections.push({ title:'Authentication', count: checks.length || 1, html: authHtml });
  }

  // Received Chain
  if (hops.length) {
    let ht = `<table class="hop-table">
      <thead><tr><th>#</th><th>Sender</th><th>Receiver</th><th>Protocol</th><th>Timestamp</th><th>Delay</th></tr></thead><tbody>`;
    hops.forEach((hop, i) => {
      const ds = hop.delay_seconds;
      let dcls = 'hop-delay-badge', dtxt = '—';
      if (ds != null) {
        dtxt = ds >= 0 ? `+${ds}s` : `${ds}s`;
        dcls += ds < 0 ? ' hop-delay-neg' : ds < 5 ? ' hop-delay-fast' : '';
      }
      const ips = hop.ips && hop.ips.length
        ? `<br><span style="color:#5bc8ff;font-size:10px">[${escHtml(hop.ips.join(', '))}]</span>` : '';
      ht += `<tr>
        <td class="hop-idx">${i+1}</td>
        <td>${escHtml(hop.sender||'—')}${ips}</td>
        <td>${escHtml(hop.receiver||'—')}</td>
        <td style="color:var(--text-dim)">${escHtml(hop.protocol||'—')}</td>
        <td style="color:var(--text-dim);font-size:11px;white-space:nowrap">${escHtml(hop.timestamp_iso||'—')}</td>
        <td><span class="${dcls}">${dtxt}</span></td>
      </tr>
      <tr class="hop-raw-row"><td colspan="6">${escHtml(hop.raw)}</td></tr>`;
    });
    ht += '</tbody></table>';
    sections.push({ title:'Received Chain', count: hops.length, html: ht });
  }

  // IOC
  const ips = iocs.ips||[], domains = iocs.domains||[], urls = iocs.urls||[], hashes = iocs.hashes||[];
  const iocTotal = ips.length + domains.length + urls.length + hashes.length;
  if (iocTotal > 0) {
    const tabs = [
      { id:'ioc-ips',     label:`IPs (${ips.length})`,         items:ips,     cls:'',    type:'ip'     },
      { id:'ioc-domains', label:`Domains (${domains.length})`, items:domains, cls:'',    type:'domain' },
      { id:'ioc-urls',    label:`URLs (${urls.length})`,       items:urls,    cls:'url', type:'url'    },
      { id:'ioc-hashes',  label:`Hashes (${hashes.length})`,   items:hashes,  cls:'hash',type:'hash'   },
    ];
    const tabBar = tabs.map((t,i) =>
      `<button class="ioc-tab${i===0?' active':''}" onclick="switchIocTab('${t.id}',this)">${t.label}</button>`
    ).join('');
    const panels = tabs.map((t,i) => {
      const copyAllText = t.type==='hash' ? hashes.map(h=>h.sha256).join('\n') : t.items.join('\n');
      let inner = '';
      if (t.type === 'hash') {
        inner = hashes.length
          ? hashes.map(h=>`<div class="ioc-item">
              <div style="flex:1"><div class="ioc-fname">${escHtml(h.filename)}</div>
              <div class="ioc-val hash">${escHtml(h.sha256)}</div></div>
              <button class="copy-btn" data-copy="${escAttr(h.sha256)}" onclick="copyText(this)">Copy</button>
            </div>`).join('')
          : '<div class="ioc-empty">No attachment hashes</div>';
      } else {
        inner = t.items.length
          ? t.items.map(v=>`<div class="ioc-item">
              <span class="ioc-val ${t.cls}">${escHtml(v)}</span>
              <button class="copy-btn" data-copy="${escAttr(v)}" onclick="copyText(this)">Copy</button>
            </div>`).join('')
          : `<div class="ioc-empty">No ${t.type}s found</div>`;
      }
      const hasItems = t.type==='hash' ? hashes.length>0 : t.items.length>0;
      const copyAllBtn = hasItems
        ? `<button class="copy-btn copy-all-btn" data-copy="${escAttr(copyAllText)}" onclick="copyText(this)">⎘ Copy All</button>` : '';
      return `<div class="ioc-panel${i===0?' active':''}" id="${t.id}">
        ${copyAllBtn?`<div style="padding:8px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:flex-end">${copyAllBtn}</div>`:''}
        <div class="ioc-list">${inner}</div>
      </div>`;
    }).join('');
    sections.push({ title:'IOC — IPs / Domains / URLs / Hashes', count:iocTotal,
      html:`<div class="ioc-tabs">${tabBar}</div>${panels}` });
  }

  // X-Headers
  if (xHdrs.length) {
    const byVendor = {};
    xHdrs.forEach(x => { const v = x.vendor||'Custom'; (byVendor[v]=byVendor[v]||[]).push(x); });
    let xHtml = '';
    Object.entries(byVendor).forEach(([vendor, hdrs]) => {
      xHtml += `<div style="border-bottom:1px solid var(--border)">
        <div style="padding:8px 16px 4px;font-size:10px;color:#5bc8ff;letter-spacing:.08em;text-transform:uppercase">${escHtml(vendor)}</div>
        <table class="kv-table" style="margin-bottom:4px">`;
      hdrs.forEach(x => x.values.forEach(v => {
        xHtml += `<tr><td>${escHtml(x.name)}</td><td>${escHtml(v)}</td></tr>`;
      }));
      xHtml += '</table></div>';
    });
    sections.push({ title:'X-Headers', count:xHdrs.length, html:xHtml });
  }

  // Attachments
  if (attaches.length) {
    sections.push({ title:'Attachments', count:attaches.length,
      html: attaches.map(a => `
        <div class="attach-row">
          <span class="attach-icon">📎</span>
          <span class="attach-name">${escHtml(a.filename)}</span>
          <span class="attach-type">${escHtml(a.content_type)}</span>
          <span class="attach-size" style="margin-left:auto">${formatBytes(a.size_bytes)}</span>
          ${a.sha256?`<a class="dl-btn" href="/attachment/${escHtml(a.sha256)}" title="Download as .bin">⬇ .bin</a>`:''}
        </div>
        ${a.sha256?`<div style="padding:0 16px 10px;font-size:10px;color:var(--text-dim)">SHA-256: <span style="color:var(--accent);font-family:var(--mono)">${escHtml(a.sha256)}</span></div>`:''}
      `).join('')
    });
  }

  // HTML Body — block remote only + source view (no "with remote" option)
  if (bodies.html_b64) {
    sections.push({ title:'HTML Body', count:'', html: buildHtmlViewer(bodies.html_b64) });
  } else if (bodies.plain) {
    sections.push({ title:'Plain Body', count:'',
      html:`<div class="raw-block" style="max-height:400px">${escHtml(bodies.plain)}</div>` });
  }

  // All Headers raw
  const rawBlock = allHdrs.map(h =>
    h.values.map(v => `<span class="h-name">${escHtml(h.name)}</span>: <span class="h-val">${escHtml(v)}</span>`).join('\n')
  ).join('\n');
  sections.push({ title:'All Headers (Raw)', count:allHdrs.reduce((s,h)=>s+h.values.length,0),
    html:`<div class="raw-block">${rawBlock}</div>` });

  document.getElementById('sections-container').innerHTML = sections.map((s,i) => `
    <div class="section" id="sec-${i}">
      <div class="section-head" onclick="toggleSection(${i})">
        <span class="section-name">${escHtml(s.title)}
          ${s.count!==''?`<span class="section-count">${s.count}</span>`:''}
        </span>
        <span class="chevron">▾</span>
      </div>
      <div class="section-body">${s.html}</div>
    </div>`).join('');

  document.getElementById('results').classList.add('visible');
  document.getElementById('results').scrollIntoView({ behavior:'smooth', block:'start' });
}

// ─── HTML viewer (block remote + source only) ─────────────────────────────
// Uses srcdoc with sandbox="allow-same-origin" which blocks all remote
// network requests while allowing the HTML to render inline styles/images.
function buildHtmlViewer(html_b64) {
  return `
    <div class="html-toolbar" id="html-toolbar">
      <span style="font-size:10px;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;margin-right:4px;">View:</span>
      <button class="active" onclick="htmlMode('render',this)">Render (Block Remote)</button>
      <button onclick="htmlMode('source',this)">HTML Source</button>
    </div>
    <div id="html-viewer-body" data-b64="${escAttr(html_b64)}">
      ${buildSrcdoc(b64DecodeUnicode(html_b64))}
    </div>`;
}

function buildSrcdoc(html) {
  // sandbox="allow-same-origin" — renders the HTML but blocks all network
  // requests (images from external URLs, remote stylesheets, scripts).
  return `<iframe class="html-frame" sandbox="allow-same-origin" srcdoc="${escAttr(html)}"></iframe>`;
}

function htmlMode(mode, btn) {
  document.querySelectorAll('#html-toolbar button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const body = document.getElementById('html-viewer-body');
  const b64  = body.getAttribute('data-b64');
  const raw  = b64DecodeUnicode(b64 || '');
  if (mode === 'source') {
    body.innerHTML = `<div class="html-source">${syntaxHighlightHtml(raw)}</div>`;
  } else {
    body.innerHTML = buildSrcdoc(raw);
  }
  body.setAttribute('data-b64', b64);  // restore after innerHTML wipe
}

// ─── HTML syntax highlighter ──────────────────────────────────────────────
function syntaxHighlightHtml(raw) {
  let safe = escHtml(raw);
  safe = safe.replace(/(&lt;!DOCTYPE[^&]*&gt;)/gi, '<span class="hl-doctype">$1</span>');
  safe = safe.replace(/(&lt;!--[\s\S]*?--&gt;)/g,  '<span class="hl-cmt">$1</span>');
  return safe.replace(/(&lt;\/?[a-z0-9]+)(.*?)(&gt;)/gi, (_, tagStart, middle, tagEnd) => {
    const hiAttrs = middle.replace(/([a-z-]+)=(&quot;.*?&quot;|&#39;.*?&#39;)/gi,
      ' <span class="hl-attr">$1</span>=<span class="hl-val">$2</span>');
    return `<span class="hl-tag">${tagStart}</span>${hiAttrs}<span class="hl-tag">${tagEnd}</span>`;
  });
}

// ─── MIME tree ────────────────────────────────────────────────────────────
function renderMimeNode(node) {
  const fn    = node.filename ? `<span class="mime-fn">📎 ${escHtml(node.filename)}</span>` : '';
  const dis   = node.content_disposition ? `<span class="mime-dis">[${escHtml(node.content_disposition)}]</span>` : '';
  const enc   = node.content_transfer_encoding ? `<span class="mime-enc">${escHtml(node.content_transfer_encoding)}</span>` : '';
  const trunc = node.truncated ? '<span style="color:var(--warn);font-size:10px"> [truncated]</span>' : '';
  let html = `<div class="mime-node"><span class="mime-type">${escHtml(node.content_type)}</span>${dis}${fn}${enc}${trunc}`;
  if (node.children && node.children.length) html += node.children.map(renderMimeNode).join('');
  return html + '</div>';
}

// ─── IOC tab switching ────────────────────────────────────────────────────
function switchIocTab(id, btn) {
  const body = btn.closest('.section-body');
  body.querySelectorAll('.ioc-tab').forEach(b => b.classList.remove('active'));
  body.querySelectorAll('.ioc-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(id).classList.add('active');
}

// ─── Copy with fallback ───────────────────────────────────────────────────
// Text is stored in data-copy attribute to avoid inline JS quoting issues.
// JSON.stringify() inside onclick="..." produces outer double-quotes that
// break the HTML attribute — data attributes have no such problem.
function copyText(btn) {
  const text = btn.getAttribute('data-copy') || '';
  const orig = btn.textContent;
  const ok  = () => { btn.textContent='Copied!'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent=orig; btn.classList.remove('copied'); },1500); };
  const err = () => { btn.textContent='Failed!'; setTimeout(()=>{ btn.textContent=orig; },1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(err);
  } else {
    try {
      const ta = document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); ok();
    } catch { err(); }
  }
}

// ─── Utilities ────────────────────────────────────────────────────────────
function b64DecodeUnicode(b64) {
  try {
    const binary = atob(b64);
    const bytes  = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  } catch { return ''; }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
