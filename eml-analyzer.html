<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>EML Analyzer · Case File</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="static/eml-analyzer.css" />
    </head>
    <body>
        <div class="vignette"></div>
        <div class="corner-glow"></div>

        <div class="app">
            <!-- ── Header ── -->
            <header>
                <div class="logo-wrap">
                    <div class="logo-mark">
                        <svg
                            viewBox="0 0 18 18"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <rect x="2" y="4" width="14" height="10" rx=".5" />
                            <polyline points="2,4 9,10 16,4" />
                        </svg>
                    </div>
                    <div class="logo-text">
                        <span class="logo-name">EML Analyzer</span>
                        <span class="logo-sub"
                            >Email Header Analysis</span
                        >
                    </div>
                </div>
            </header>

            <!-- ── Input card ── -->
            <div class="input-card">
                <div class="mode-selector">
                    <button
                        class="mode-btn active"
                        onclick="switchTab('file', this)"
                    >
                        <svg
                            class="mode-icon"
                            viewBox="0 0 14 14"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <rect x="2" y="1" width="9" height="12" rx=".5" />
                            <polyline points="8,1 8,5 11,5" />
                            <path d="M11 5 L8 1" />
                        </svg>
                        Upload .eml File
                        <span class="mode-btn-num">01</span>
                    </button>
                    <button class="mode-btn" onclick="switchTab('text', this)">
                        <svg
                            class="mode-icon"
                            viewBox="0 0 14 14"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                        >
                            <path d="M2 4h10M2 7h7M2 10h5" />
                        </svg>
                        Paste Headers / Raw
                        <span class="mode-btn-num">02</span>
                    </button>
                </div>

                <div id="tab-file" class="mode-panel active">
                    <div class="dropzone" id="dropzone">
                        <input
                            type="file"
                            id="fileInput"
                            accept=".eml,.msg,message/rfc822,text/plain"
                        />
                        <div class="drop-reticle">
                            <div class="reticle-ring ring-outer"></div>
                            <div class="reticle-ring ring-inner"></div>
                            <div class="reticle-lines"></div>
                            <svg viewBox="0 0 16 16" fill="none">
                                <path
                                    d="M8 11V5M5 8l3-3 3 3"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                                <path
                                    d="M2 12v1h12v-1"
                                    stroke-linecap="round"
                                />
                            </svg>
                        </div>
                        <div class="drop-title">Drop .eml file here</div>
                        <div class="drop-sub">
                            or click to browse —<span>.eml</span
                            ><span>.msg</span><span>text/plain</span>
                        </div>
                    </div>
                    <div
                        id="file-loaded"
                        style="display: none"
                        class="file-loaded"
                    >
                        <div class="file-loaded-icon">
                            <svg
                                viewBox="0 0 14 14"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <rect
                                    x="2"
                                    y="1"
                                    width="9"
                                    height="12"
                                    rx=".5"
                                    stroke="currentColor"
                                    stroke-width="1.3"
                                />
                                <polyline
                                    points="8,1 8,5 11,5"
                                    stroke="currentColor"
                                    stroke-width="1.3"
                                />
                            </svg>
                        </div>
                        <span class="file-name-text" id="file-name"></span>
                        <span class="file-loaded-meta" id="file-size"></span>
                    </div>
                </div>

                <div id="tab-text" class="mode-panel">
                    <div class="textarea-wrap">
                        <textarea
                            id="rawInput"
                            placeholder="From: sender@example.com&#10;To: recipient@example.com&#10;Subject: Test Email&#10;Date: Mon, 1 Jan 2025 12:00:00 +0000&#10;Received: from mail.example.com ...&#10;Authentication-Results: spf=pass dkim=pass dmarc=pass&#10;..."
                        ></textarea>
                    </div>
                </div>

                <div class="action-row">
                    <button
                        class="btn btn-primary"
                        id="analyze-btn"
                        onclick="analyzeActive()"
                    >
                        <svg
                            viewBox="0 0 12 12"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.6"
                        >
                            <circle cx="5" cy="5" r="4" />
                            <path d="M8.5 8.5l2.5 2.5" />
                        </svg>
                        Analyze
                    </button>
                    <button class="btn btn-ghost" onclick="clearAll()">
                        Clear
                    </button>
                    <span class="action-hint">
                        <span id="active-mode-hint"
                            >File upload mode active</span
                        >
                        <span class="cursor-blink"></span>
                    </span>
                </div>
            </div>

            <!-- ── Results ── -->
            <div id="results">
                <div class="spacer-lg"></div>

                <div class="results-header">
                    <div>
                        <span class="results-label"
                            >Output · Analysis Report</span
                        >
                        <span class="results-title-text">Signal Results</span>
                    </div>
                    <span id="parse-status" class="status-badge badge-ok"
                        ><span class="dot"></span> Parsed OK</span
                    >
                </div>

                <div id="error-box" class="error-box" style="display: none">
                    <svg
                        class="err-icon"
                        width="14"
                        height="14"
                        viewBox="0 0 14 14"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                    >
                        <circle cx="7" cy="7" r="6" />
                        <path d="M7 4v3.5M7 9.5v.5" />
                    </svg>
                    <span id="error-text"></span>
                </div>

                <div class="summary-strip" id="summary-strip"></div>
                <div class="sections-wrap" id="sections-container"></div>
            </div>
        </div>
        <!-- /.app -->

        <script>
            // ══ Tab switching ═══════════════════════════════════════════════════════════
            let activeTabId = "file";
            function switchTab(id, btn) {
                activeTabId = id;
                document
                    .querySelectorAll(".mode-btn")
                    .forEach((b) => b.classList.remove("active"));
                document
                    .querySelectorAll(".mode-panel")
                    .forEach((p) => p.classList.remove("active"));
                btn.classList.add("active");
                document.getElementById("tab-" + id).classList.add("active");
                document.getElementById("active-mode-hint").textContent =
                    id === "file"
                        ? "File upload mode active"
                        : "Paste mode active";
            }

            function toggleSection(i) {
                document
                    .getElementById("sec-" + i)
                    .classList.toggle("collapsed");
            }

            // ══ File handling ═══════════════════════════════════════════════════════════
            let loadedFile = null;
            let loadedFileContent = null;
            let isAnalyzing = false;
            let renderCounter = 0;
            const htmlBodyStore = new Map();
            const dropzone = document.getElementById("dropzone");
            const fileInput = document.getElementById("fileInput");

            dropzone.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropzone.classList.add("dragover");
            });
            dropzone.addEventListener("dragleave", () =>
                dropzone.classList.remove("dragover"),
            );
            dropzone.addEventListener("drop", (e) => {
                e.preventDefault();
                dropzone.classList.remove("dragover");
                const f = e.dataTransfer.files[0];
                if (f) loadFile(f);
            });
            fileInput.addEventListener("change", () => {
                if (fileInput.files[0]) loadFile(fileInput.files[0]);
            });

            function loadFile(f) {
                loadedFile = f;
                const reader = new FileReader();
                reader.onload = (e) => {
                    loadedFileContent = e.target.result;
                    dropzone.style.display = "none";
                    document.getElementById("file-loaded").style.display =
                        "flex";
                    document.getElementById("file-name").textContent = f.name;
                    document.getElementById("file-size").textContent =
                        formatBytes(f.size);
                };
                reader.readAsText(f);
            }

            function clearAll() {
                loadedFile = null;
                loadedFileContent = null;
                fileInput.value = "";
                dropzone.style.display = "block";
                document.getElementById("file-loaded").style.display = "none";
                document.getElementById("rawInput").value = "";
                document.getElementById("error-box").style.display = "none";
                document.getElementById("summary-strip").innerHTML = "";
                document.getElementById("sections-container").innerHTML = "";
                document.querySelector(".results-title-text").textContent =
                    "Analysis Results";
                setStatus("neutral", "Idle");
                setAnalyzeState(false);
                document.getElementById("results").classList.remove("visible");
            }

            function formatBytes(b) {
                if (b < 1024) return b + " B";
                if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
                return (b / 1048576).toFixed(1) + " MB";
            }

            // ══ Analyze dispatcher ══════════════════════════════════════════════════════
            function analyzeActive() {
                if (isAnalyzing) return;
                if (activeTabId === "file") analyzeFile();
                else analyzeText();
            }

            // ══ Backend API ═════════════════════════════════════════════════════════════
            async function callBackend(endpoint, payload) {
                let resp;
                try {
                    if (endpoint === "file") {
                        const fd = new FormData();
                        fd.append("file", payload);
                        resp = await fetch("/analyze/file", {
                            method: "POST",
                            body: fd,
                        });
                    } else {
                        resp = await fetch("/analyze/text", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ raw: payload }),
                        });
                    }
                } catch {
                    throw new Error(
                        "Could not reach server - is the backend running?",
                    );
                }
                if (!resp.ok) {
                    const err = await resp
                        .json()
                        .catch(() => ({ error: resp.statusText }));
                    throw new Error(
                        `HTTP ${resp.status}: ${err.error || resp.statusText || "Server error"}`,
                    );
                }
                return resp.json();
            }

            async function runAnalyze(endpoint, payload) {
                setAnalyzeState(true);
                setStatus("warn", "Parsing...");
                document.getElementById("error-box").style.display = "none";
                try {
                    renderFromBackend(await callBackend(endpoint, payload));
                } catch (e) {
                    showError(e.message);
                } finally {
                    setAnalyzeState(false);
                }
            }

            function analyzeFile() {
                const file = fileInput.files[0] || loadedFile;
                if (!file && !loadedFileContent) {
                    alert("Please select an .eml file first.");
                    return;
                }
                if (file) {
                    runAnalyze("file", file);
                    return;
                }
                runAnalyze("text", loadedFileContent);
            }

            function analyzeText() {
                const raw = document.getElementById("rawInput").value.trim();
                if (!raw) {
                    alert("Please paste some content first.");
                    return;
                }
                runAnalyze("text", raw);
            }

            function showError(msg) {
                const eb = document.getElementById("error-box");
                document.getElementById("error-text").textContent = msg;
                eb.style.display = "flex";
                setStatus("error", "Parse Failed");
                document.getElementById("results").classList.add("visible");
            }

            function setAnalyzeState(loading) {
                isAnalyzing = loading;
                const btn = document.getElementById("analyze-btn");
                const hint = document.getElementById("active-mode-hint");
                const hintWrap = hint.closest(".action-hint");
                btn.disabled = loading;
                hintWrap.classList.toggle("loading", loading);
                hint.textContent = loading
                    ? "Parsing..."
                    : activeTabId === "file"
                      ? "File upload mode active"
                      : "Paste mode active";
            }

            function setStatus(kind, label) {
                const status = document.getElementById("parse-status");
                const cls =
                    kind === "error"
                        ? "badge-error"
                        : kind === "warn"
                          ? "badge-warn"
                          : "badge-ok";
                status.className = `status-badge ${cls}`;
                status.innerHTML = `<span class="dot"></span> ${label}`;
            }

            // ══ Main renderer ═══════════════════════════════════════════════════════════
            function renderFromBackend(d) {
                document.getElementById("error-box").style.display = "none";
                const renderId = ++renderCounter;
                const core = d.core || {};
                const fromObj = core.from || {};
                const auth = d.authentication || {};
                const hops = d.received_chain || [];
                const attaches = d.attachments || [];
                const summary = d.summary || {};
                const allHdrs = d.all_headers || [];
                const xHdrs = d.x_headers || [];
                const iocs = d.iocs || {};
                const mime = d.mime_structure || null;
                const bodies = d.bodies || {};

                setStatus("ok", "Parsed OK");

                // Summary strip
                const fromAddr = fromObj.address || "—";
                document.getElementById("summary-strip").innerHTML = [
                    { label: "From", value: fromAddr || "—", cls: "" },
                    { label: "Subject", value: core.subject || "—", cls: "" },
                    {
                        label: "Date",
                        value: core.date ? core.date.raw || "—" : "—",
                        cls: "",
                    },
                    {
                        label: "Hops",
                        value: summary.hop_count ?? "—",
                        cls: summary.hop_count > 5 ? "warn" : "accent",
                    },
                    {
                        label: "IPs / Domains",
                        value: `${(iocs.ips || []).length} / ${(iocs.domains || []).length}`,
                        cls: "",
                    },
                    {
                        label: "Attachments",
                        value: summary.attachment_count ?? 0,
                        cls: summary.attachment_count ? "warn" : "",
                    },
                ]
                    .map(
                        (c) => `
    <div class="summary-card">
      <div class="sc-label">${c.label}</div>
      <div class="sc-value ${c.cls}">${escHtml(String(c.value))}</div>
    </div>`,
                    )
                    .join("");

                const sections = [];

                // MIME Structure
                if (mime) {
                    sections.push({
                        title: "MIME Structure",
                        count: "",
                        html: `<div class="mime-wrap">${renderMimeNode(mime)}</div>`,
                    });
                }

                // Core Headers
                const mismatch = core.reply_to && core.reply_to.mismatch;
                const toStr = (core.to || [])
                    .map((t) =>
                        t.name ? `${t.name} <${t.address}>` : t.address,
                    )
                    .join(", ");
                const ccStr = (core.cc || [])
                    .map((t) =>
                        t.name ? `${t.name} <${t.address}>` : t.address,
                    )
                    .join(", ");
                const bccStr = (core.bcc || [])
                    .map((t) =>
                        t.name ? `${t.name} <${t.address}>` : t.address,
                    )
                    .join(", ");
                const coreRows = [
                    ["From", fromObj.raw || ""],
                    ["To", toStr],
                    ["CC", ccStr],
                    ["BCC", bccStr],
                    [
                        "Reply-To",
                        (core.reply_to?.raw || "") +
                            (mismatch ? " ⚠ domain mismatch" : ""),
                    ],
                    ["Subject", core.subject],
                    ["Date", core.date ? core.date.raw : ""],
                    ["Message-ID", core.message_id],
                    ["MIME-Version", core.mime_version],
                    ["Content-Type", core.content_type],
                    ["X-Mailer", core.x_mailer],
                    ["X-Originating-IP", core.x_originating_ip],
                ].filter(([, v]) => v);
                sections.push({
                    title: "Core Headers",
                    count: coreRows.length,
                    html: `<table class="kv-table">${coreRows
                        .map(
                            ([k, v]) => `
      <tr>
        <td>${escHtml(k)}</td>
        <td style="${k === "Reply-To" && mismatch ? "color:var(--warn)" : ""}">${escHtml(v)}</td>
      </tr>`,
                        )
                        .join("")}</table>`,
                });

                // Authentication
                if (auth.raw) {
                    const checks = auth.checks || [];
                    let authHtml = "";
                    if (checks.length) {
                        authHtml += checks
                            .map((c) => {
                                const pass = ["pass", "bestguesspass"].includes(
                                    c.result,
                                );
                                const fail = [
                                    "fail",
                                    "hardfail",
                                    "softfail",
                                    "none",
                                    "permerror",
                                    "temperror",
                                ].includes(c.result);
                                const pillCls = pass
                                    ? "pill-pass"
                                    : fail
                                      ? "pill-fail"
                                      : "pill-none";
                                return `<div class="auth-block">
          <div class="auth-proto-row">
            <span class="auth-proto-name">${c.name}</span>
            <span class="pill ${pillCls}" style="flex-shrink:0;margin-top:1px">${escHtml(c.result)}</span>
            <span class="auth-clause">${escHtml(c.clause || "")}</span>
          </div>
        </div>`;
                            })
                            .join("");
                    }
                    authHtml += `<div style="padding:6px 20px 14px">
      <div style="font-family:var(--code);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;margin-top:10px">Full Authentication-Results</div>
      <div class="auth-raw-block">${escHtml(auth.raw)}</div>
    </div>`;
                    if (auth.received_spf)
                        authHtml += `<div class="auth-block"><div class="auth-proto-row">
      <span class="auth-proto-name">SPF HDR</span>
      <span class="auth-clause">${escHtml(auth.received_spf)}</span>
    </div></div>`;
                    if (auth.dkim_header)
                        authHtml += `<div class="auth-block"><div class="auth-proto-row">
      <span class="auth-proto-name">DKIM SIG</span>
      <span class="auth-clause" style="word-break:break-all">${escHtml(auth.dkim_header)}</span>
    </div></div>`;
                    sections.push({
                        title: "Authentication",
                        count: checks.length || 1,
                        html: authHtml,
                    });
                }

                // Received Chain
                if (hops.length) {
                    let ht = `<table class="hop-table">
      <thead><tr><th>#</th><th>Sender</th><th>Receiver</th><th>Protocol</th><th>Timestamp</th><th>Delay</th></tr></thead><tbody>`;
                    hops.forEach((hop, i) => {
                        const ds = hop.delay_seconds;
                        let dcls = "hop-delay",
                            dtxt = "—";
                        if (ds != null) {
                            dtxt = ds >= 0 ? `+${ds}s` : `${ds}s`;
                            dcls +=
                                ds < 0
                                    ? " hop-delay-neg"
                                    : ds < 5
                                      ? " hop-delay-fast"
                                      : " hop-delay-slow";
                        } else {
                            dcls += " hop-delay-dash";
                        }
                        const ips =
                            hop.ips && hop.ips.length
                                ? `<br><span style="color:var(--accent2);font-family:var(--code);font-size:10px">[${escHtml(hop.ips.join(", "))}]</span>`
                                : "";
                        ht += `<tr>
        <td class="hop-idx">${i + 1}</td>
        <td>${escHtml(hop.sender || "—")}${ips}</td>
        <td>${escHtml(hop.receiver || "—")}</td>
        <td style="color:var(--text-dim);font-family:var(--code);font-size:11px">${escHtml(hop.protocol || "—")}</td>
        <td style="color:var(--text-dim);font-family:var(--code);font-size:11px;white-space:nowrap">${escHtml(hop.timestamp_iso || "—")}</td>
        <td><span class="${dcls}">${dtxt}</span></td>
      </tr>
      <tr class="hop-raw-row"><td colspan="6">${escHtml(hop.raw)}</td></tr>`;
                    });
                    ht += "</tbody></table>";
                    sections.push({
                        title: "Received Chain",
                        count: hops.length,
                        html: ht,
                    });
                }

                // IOC
                const ips = iocs.ips || [],
                    domains = iocs.domains || [],
                    urls = iocs.urls || [],
                    hashes = iocs.hashes || [];
                const iocTotal =
                    ips.length + domains.length + urls.length + hashes.length;
                if (iocTotal > 0) {
                    const tabs = [
                        {
                            id: `ioc-ips-${renderId}`,
                            label: `IPs (${ips.length})`,
                            items: ips,
                            cls: "",
                            type: "ip",
                        },
                        {
                            id: `ioc-domains-${renderId}`,
                            label: `Domains (${domains.length})`,
                            items: domains,
                            cls: "",
                            type: "domain",
                        },
                        {
                            id: `ioc-urls-${renderId}`,
                            label: `URLs (${urls.length})`,
                            items: urls,
                            cls: "url",
                            type: "url",
                        },
                        {
                            id: `ioc-hashes-${renderId}`,
                            label: `Hashes (${hashes.length})`,
                            items: hashes,
                            cls: "hash",
                            type: "hash",
                        },
                    ];
                    const tabBar = tabs
                        .map(
                            (t, i) =>
                                `<button class="ioc-tab${i === 0 ? " active" : ""}" onclick="switchIocTab('${t.id}',this)">${t.label}</button>`,
                        )
                        .join("");
                    const panels = tabs
                        .map((t, i) => {
                            const copyAllText =
                                t.type === "hash"
                                    ? hashes.map((h) => h.sha256).join("\n")
                                    : t.items.join("\n");
                            let inner = "";
                            if (t.type === "hash") {
                                inner = hashes.length
                                    ? hashes
                                          .map(
                                              (h) => `<div class="ioc-item">
              <div style="flex:1">
                <div class="ioc-fname">${escHtml(h.filename)}</div>
                <div class="ioc-val hash">${escHtml(h.sha256)}</div>
              </div>
              <button class="copy-btn" data-copy="${escAttr(h.sha256)}" onclick="copyText(this)">Copy</button>
            </div>`,
                                          )
                                          .join("")
                                    : '<div class="ioc-empty">No attachment hashes</div>';
                            } else {
                                inner = t.items.length
                                    ? t.items
                                          .map(
                                              (v) => `<div class="ioc-item">
              <span class="ioc-val ${t.cls}">${escHtml(v)}</span>
              <button class="copy-btn" data-copy="${escAttr(v)}" onclick="copyText(this)">Copy</button>
            </div>`,
                                          )
                                          .join("")
                                    : `<div class="ioc-empty">No ${t.type}s found</div>`;
                            }
                            const hasItems =
                                t.type === "hash"
                                    ? hashes.length > 0
                                    : t.items.length > 0;
                            const copyAllBtn = hasItems
                                ? `<button class="copy-btn copy-all-btn" data-copy="${escAttr(copyAllText)}" onclick="copyText(this)">⎘ Copy All</button>`
                                : "";
                            return `<div class="ioc-panel${i === 0 ? " active" : ""}" id="${t.id}" data-ioc-panel="${t.id}">
        ${copyAllBtn ? `<div class="ioc-toolbar">${copyAllBtn}</div>` : ""}
        <div class="ioc-list">${inner}</div>
      </div>`;
                        })
                        .join("");
                    sections.push({
                        title: "IOC — IPs / Domains / URLs / Hashes",
                        count: iocTotal,
                        html: `<div class="ioc-tabs">${tabBar}</div>${panels}`,
                    });
                }

                // X-Headers
                if (xHdrs.length) {
                    const byVendor = {};
                    xHdrs.forEach((x) => {
                        const v = x.vendor || "Custom";
                        (byVendor[v] = byVendor[v] || []).push(x);
                    });
                    let xHtml = "";
                    Object.entries(byVendor).forEach(([vendor, hdrs]) => {
                        xHtml += `<div style="border-bottom:1px solid var(--border)">
        <div class="xhdr-vendor">${escHtml(vendor)}</div>
        <table class="kv-table" style="margin-bottom:4px">`;
                        hdrs.forEach((x) =>
                            x.values.forEach((v) => {
                                xHtml += `<tr><td>${escHtml(x.name)}</td><td>${escHtml(v)}</td></tr>`;
                            }),
                        );
                        xHtml += "</table></div>";
                    });
                    sections.push({
                        title: "X-Headers",
                        count: xHdrs.length,
                        html: xHtml,
                    });
                }

                // Attachments
                if (attaches.length) {
                    sections.push({
                        title: "Attachments",
                        count: attaches.length,
                        html: attaches
                            .map(
                                (a) => `
        <div class="attach-row">
          <div class="attach-icon-wrap">
            <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 9V4M7 9l-2-2M7 9l2-2" stroke="currentColor" stroke-width="1.3"/>
              <path d="M2 11h10" stroke="currentColor" stroke-width="1.3"/>
            </svg>
          </div>
          <span class="attach-name">${escHtml(a.filename)}</span>
          <span class="attach-type">${escHtml(a.content_type)}</span>
          <span class="attach-size">${formatBytes(a.size_bytes)}</span>
          ${
              a.sha256
                  ? `<a class="dl-btn" href="/attachment/${escHtml(a.sha256)}" title="Download as .bin">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 2v5M3 5l2 2 2-2"/><path d="M1 8h8"/></svg>
            .bin
          </a>`
                  : ""
          }
        </div>
        ${a.sha256 ? `<div class="attach-hash">SHA-256 <span>${escHtml(a.sha256)}</span></div>` : ""}
      `,
                            )
                            .join(""),
                    });
                }

                // HTML Body
                if (bodies.html_b64) {
                    sections.push({
                        title: "HTML Body",
                        count: "",
                        html: buildHtmlViewer(bodies.html_b64, renderId),
                    });
                } else if (bodies.plain) {
                    sections.push({
                        title: "Plain Body",
                        count: "",
                        html: `<div class="raw-block" style="max-height:400px">${escHtml(bodies.plain)}</div>`,
                    });
                }

                // All Headers raw
                const rawBlock = allHdrs
                    .map((h) =>
                        h.values
                            .map(
                                (v) =>
                                    `<span class="h-name">${escHtml(h.name)}</span>: <span class="h-val">${escHtml(v)}</span>`,
                            )
                            .join("\n"),
                    )
                    .join("\n");
                sections.push({
                    title: "All Headers (Raw)",
                    count: allHdrs.reduce((s, h) => s + h.values.length, 0),
                    html: `<div class="raw-block">${rawBlock}</div>`,
                });

                document.getElementById("sections-container").innerHTML =
                    sections
                        .map(
                            (s, i) => `
    <div class="section" id="sec-${i}">
      <div class="section-head" onclick="toggleSection(${i})">
        <div class="section-head-left">
          <span class="section-num">${String(i + 1).padStart(2, "0")}</span>
          <span class="section-name">${escHtml(s.title)}
            ${s.count !== "" ? `<span class="section-count">${s.count}</span>` : ""}
          </span>
        </div>
        <div class="section-head-right">
          <span class="expand-indicator">OPEN</span>
          <div class="chevron-wrap">
            <svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polyline points="2,3 5,7 8,3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="section-body">${s.html}</div>
    </div>`,
                        )
                        .join("");

                document.getElementById("results").classList.add("visible");
                document
                    .getElementById("results")
                    .scrollIntoView({ behavior: "smooth", block: "start" });
            }

            // ══ HTML viewer ═════════════════════════════════════════════════════════════
            function buildHtmlViewer(html_b64, renderId) {
                const decoded = b64DecodeUnicode(html_b64);
                if (!decoded.ok) {
                    return '<div class="html-error">HTML body could not be decoded</div>';
                }
                htmlBodyStore.set(renderId, decoded.value);
                return `
    <div class="html-toolbar">
      <span class="html-tb-label">View:</span>
      <button class="active" onclick="htmlMode('render',this,${renderId})">Render (Block Remote)</button>
      <button onclick="htmlMode('source',this,${renderId})">HTML Source</button>
    </div>
    <div id="html-viewer-body-${renderId}">
      ${buildSrcdoc(decoded.value)}
    </div>`;
            }

            function buildSrcdoc(html) {
                const safeHtml = disableRenderedLinks(html);
                const guard = `<style>
                  a[data-disabled-href], area[data-disabled-href] {
                    color: #0645ad !important;
                    text-decoration: underline !important;
                    pointer-events: auto !important;
                    cursor: default !important;
                  }
                  a[data-disabled-href]:hover, area[data-disabled-href]:hover {
                    color: #0b63ce !important;
                    text-decoration: underline !important;
                    cursor: not-allowed !important;
                  }
                </style>`;
                const guardedHtml = /<\/head>/i.test(safeHtml)
                    ? safeHtml.replace(/<\/head>/i, `${guard}</head>`)
                    : `${guard}${safeHtml}`;
                return `<iframe class="html-frame" sandbox="allow-same-origin" onload="wireRenderedLinkCopy(this)" srcdoc="${escAttr(guardedHtml)}"></iframe>`;
            }

            function wireRenderedLinkCopy(frame) {
                try {
                    const doc = frame.contentDocument;
                    if (!doc || doc.__linkCopyReady) return;
                    doc.__linkCopyReady = true;
                    doc.addEventListener("contextmenu", (event) => {
                        const link = event.target.closest(
                            "a[data-disabled-href], area[data-disabled-href]",
                        );
                        if (!link) return;
                        event.preventDefault();
                        copyUrlToClipboard(link.dataset.disabledHref || "");
                    });
                } catch {
                    showCopyToast("Could not read link");
                }
            }

            function copyUrlToClipboard(url) {
                if (!url) {
                    showCopyToast("No URL found");
                    return;
                }
                const done = () => showCopyToast("Link copied");
                const fail = () => showCopyToast("Copy failed");
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(done).catch(fail);
                    return;
                }
                try {
                    const ta = document.createElement("textarea");
                    ta.value = url;
                    ta.style.position = "fixed";
                    ta.style.opacity = "0";
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                    done();
                } catch {
                    fail();
                }
            }

            function showCopyToast(message) {
                let toast = document.getElementById("copy-toast");
                if (!toast) {
                    toast = document.createElement("div");
                    toast.id = "copy-toast";
                    toast.className = "copy-toast";
                    document.body.appendChild(toast);
                }
                toast.textContent = message;
                toast.classList.add("visible");
                clearTimeout(showCopyToast.timer);
                showCopyToast.timer = setTimeout(() => {
                    toast.classList.remove("visible");
                }, 1600);
            }

            function disableRenderedLinks(html) {
                try {
                    const doc = new DOMParser().parseFromString(
                        String(html),
                        "text/html",
                    );
                    doc.querySelectorAll("a[href], area[href]").forEach((el) => {
                        const href = el.getAttribute("href") || "";
                        el.setAttribute("data-disabled-href", href);
                        el.setAttribute("title", href);
                        el.setAttribute("aria-disabled", "true");
                        el.removeAttribute("href");
                    });
                    return "<!doctype html>\n" + doc.documentElement.outerHTML;
                } catch {
                    return String(html);
                }
            }

            function htmlMode(mode, btn, renderId) {
                const toolbar = btn ? btn.closest(".html-toolbar") : null;
                if (toolbar)
                    toolbar
                        .querySelectorAll("button")
                        .forEach((b) => b.classList.remove("active"));
                if (btn) btn.classList.add("active");
                const body = document.getElementById(
                    `html-viewer-body-${renderId}`,
                );
                const raw = htmlBodyStore.get(renderId);
                if (!body || raw == null) return;
                if (mode === "source") {
                    body.innerHTML = `<div class="html-source">${syntaxHighlightHtml(raw)}</div>`;
                } else {
                    body.innerHTML = buildSrcdoc(raw);
                }
            }

            // ══ HTML syntax highlighter ══════════════════════════════════════════════════
            function syntaxHighlightHtml(raw) {
                const tokenRe =
                    /(<!--[\s\S]*?-->|<!DOCTYPE[^>]*>|<\/?[a-z0-9:-]+(?:\s+[^<>]*?)?>)/gi;
                let out = "";
                let last = 0;
                String(raw).replace(tokenRe, (token, _match, offset) => {
                    out += escHtml(String(raw).slice(last, offset));
                    const safe = escHtml(token);
                    if (/^<!--/.test(token)) {
                        out += `<span class="hl-cmt">${safe}</span>`;
                    } else if (/^<!DOCTYPE/i.test(token)) {
                        out += `<span class="hl-doctype">${safe}</span>`;
                    } else {
                        out += safe.replace(
                            /^(&lt;\/?[a-z0-9:-]+)([\s\S]*?)(&gt;)$/i,
                            (_, tagStart, attrs, tagEnd) => {
                                const hiAttrs = attrs.replace(
                                    /([a-z_:][-a-z0-9_:.]*)=(&quot;.*?&quot;|&#39;.*?&#39;|[^\s&]+)?/gi,
                                    '<span class="hl-attr">$1</span>=<span class="hl-val">$2</span>',
                                );
                                return `<span class="hl-tag">${tagStart}</span>${hiAttrs}<span class="hl-tag">${tagEnd}</span>`;
                            },
                        );
                    }
                    last = offset + token.length;
                    return token;
                });
                out += escHtml(String(raw).slice(last));
                return out;
            }

            // ══ MIME tree ════════════════════════════════════════════════════════════════
            function renderMimeNode(node) {
                const fn = node.filename
                    ? `<span class="mime-fn">📎 ${escHtml(node.filename)}</span>`
                    : "";
                const dis = node.content_disposition
                    ? `<span class="mime-dis">[${escHtml(node.content_disposition)}]</span>`
                    : "";
                const enc = node.content_transfer_encoding
                    ? `<span class="mime-enc">${escHtml(node.content_transfer_encoding)}</span>`
                    : "";
                const trunc = node.truncated
                    ? '<span style="color:var(--warn);font-size:10px"> [truncated]</span>'
                    : "";
                let html = `<div class="mime-node"><span class="mime-type">${escHtml(node.content_type)}</span>${dis}${fn}${enc}${trunc}`;
                if (node.children && node.children.length)
                    html += node.children.map(renderMimeNode).join("");
                return html + "</div>";
            }

            // ══ IOC tab switching ════════════════════════════════════════════════════════
            function switchIocTab(id, btn) {
                const body = btn.closest(".section-body");
                body.querySelectorAll(".ioc-tab").forEach((b) =>
                    b.classList.remove("active"),
                );
                body.querySelectorAll(".ioc-panel").forEach((p) =>
                    p.classList.remove("active"),
                );
                btn.classList.add("active");
                const panel = Array.from(
                    body.querySelectorAll(".ioc-panel"),
                ).find((p) => p.dataset.iocPanel === id);
                if (panel) panel.classList.add("active");
            }

            // ══ Copy with fallback ═══════════════════════════════════════════════════════
            function copyText(btn) {
                const text = btn.getAttribute("data-copy") || "";
                const orig = btn.textContent;
                const ok = () => {
                    btn.textContent = "Copied!";
                    btn.classList.add("copied");
                    setTimeout(() => {
                        btn.textContent = orig;
                        btn.classList.remove("copied");
                    }, 1500);
                };
                const err = () => {
                    btn.textContent = "Failed!";
                    setTimeout(() => {
                        btn.textContent = orig;
                    }, 1500);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(ok).catch(err);
                } else {
                    try {
                        const ta = document.createElement("textarea");
                        ta.value = text;
                        ta.style.position = "fixed";
                        ta.style.opacity = "0";
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                        ok();
                    } catch {
                        err();
                    }
                }
            }

            // ══ Utilities ════════════════════════════════════════════════════════════════
            function b64DecodeUnicode(b64) {
                try {
                    const binary = atob(b64);
                    const bytes = Uint8Array.from(binary, (c) =>
                        c.charCodeAt(0),
                    );
                    return { ok: true, value: new TextDecoder().decode(bytes) };
                } catch {
                    return { ok: false, value: "" };
                }
            }

            function escHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function escAttr(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;")
                    .replace(/`/g, "&#96;");
            }
        </script>
    </body>
</html>
